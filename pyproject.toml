[build-system]
requires = ["uv_build>=0.9.22,<0.10.0"]
build-backend = "uv_build"

[project]
name = "mlo_group_project"
version = "0.3.0"
description = "Machine Learning group 5"
authors = [
  { name = "kadijairus", email = "kadijairus@gmail.com" },
]

keywords = ["machine learning", "MLOps"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dvc[gs]>=3.66.1",
    "fastapi==0.115.6",
    "hydra-core>=1.3.2",
    "loguru>=0.7.3",
    "matplotlib>=3.10.8",
    "numpy>=2.4.0, !=2.4.0",
    "omegaconf>=2.3.0",
    "pandas>=2.3.3",
    "python-dotenv>=1.2.1",
    "python-multipart>=0.0.21",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
    "streamlit>=1.53.0",
    "torch==2.6.0",
    "typer==0.15.1",
    "uvicorn==0.34.0",
    "wandb>=0.23.1",
    "invoke==2.2.0",
    "prometheus-client>=0.24.1",
]

[dependency-groups]
dev = [
    "coverage==7.6.9",
    "mkdocs-material==9.4.6",
    "mkdocs==1.6.1",
    "pre-commit==4.1.0",
    "pytest==8.3.4",
    "ruff==0.1.3",
    "mkdocstrings-python==1.12.2",
    "snakeviz>=2.2.0",
    "mypy>=1.19.1",
    "pandas-stubs>=2.3.3.260113",
    "types-requests>=2.32.4.20260107",
    "httpx>=0.28.1",
    "pytest-asyncio>=1.3.0",
]


[tool.uv.sources]
torch = [
    { index = "pytorch-cpu" },
]
torchvision = [
    { index = "pytorch-cpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 120

[tool.coverage.run]
omit = ["tests/*"]

[tool.mypy]
# This tells mypy to be strict where possible
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true

# This is the fix for sklearn and other libraries without stubs
[[tool.mypy.overrides]]
module = [
    "sklearn.*",
    "loguru.*",
    "hydra.*",
    "omegaconf.*"
]
ignore_missing_imports = true
