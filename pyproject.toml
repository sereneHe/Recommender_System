[project]
name = "project_hei"
version = "0.1.0"
description = "Healthy Eating Index (HEI) 多模态健康数据分析"
authors = [
    { name = "xiaoyuhe", email = "serene0410@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.12"
keywords = ["machine learning", "MLOps"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "dvc[gs]>=3.66.1",
    "fastapi==0.115.6",
    "hydra-core>=1.3.2",
    "loguru>=0.7.3",
    "matplotlib>=3.10.8",
    "numpy>=2.4.0, !=2.4.0",
    "omegaconf>=2.3.0",
    "pandas>=2.3.3",
    "python-dotenv>=1.2.1",
    "python-multipart>=0.0.21",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
    "streamlit>=1.53.0",
    "torch==2.6.0",
    "typer==0.15.1",
    "uvicorn==0.34.0",
    "wandb>=0.23.1",
    "invoke==2.2.0",
    "prometheus-client>=0.24.1",
    "xgboost",
    "pyyaml"
]

[tool.uv]
# uv-specific settings (optional)

[project.optional-dependencies]
dev = [
    "uv"
]
