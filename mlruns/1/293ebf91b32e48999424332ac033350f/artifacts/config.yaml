solver:
  name: hc_predictor
  model_name: HC
  custom_objective: lagrange
  N_SELECT_FEATURES: 5
  n_runs: 10
  recalculate_dag: true
  feature_selector: SequentialFeatureSelector
  n_outer: 10
  n_inner: 50
  hidden_dim: 32
  depth: 2
  rho0: 1.0
  lambda0: 1.0
  rho_mult: 1.0
  learning_rate: 0.2
  lambda_update_rate: 0.2
  loss_type: l2
  reg_type: l2
  a_reg_type: l1
  lambda1: 0.1
  lambda2: 0.1
  nonzero_threshold: 0.001
  constraints_mode: weights
  callback_mode: all_cycles
  robust: false
  tabu_edges: false
  weights_bound: 1.0
  time_limit: 1800
  target_mip_gap: 0.0001
  data_path: ./data/
  knowledge_graph_filename: knowledge_graph_intersection.graphml
  debug: false
problem:
  name: codiet
  target: CRP (mg/dL)
  features:
  - food_SOLFATC
  - lean_mass(%)_of_trunk
  - ms_serum_histidine
  - nmr_urine_benzoic-acid
  - nmr_urine_oxaloacetic-acid
  - nmr_urine_adenosine
  - ms_lip_fahfa-17:0/18:0
  - ms_lip_lnape-18:2/n-18:2
  - dbs_rbc_lip_d-palmitoleic-16-1n7
  - microb_4cl_label_2
  - microb_4cl_label_3
  - microb_phyl4cl_label_2
  - microb_phyl4cl_label_3
  - microb_large_emb_coord_14
  - microb_large_emb_coord_18
  - microb_clean15_trnk_k__Bacteria|p__Bacteroidetes|c__Bacteroidia|o__Bacteroidales|f__Rikenellaceae|g__Alistipes
  - normed_food_WHOLEFRT
  - normed_food_T_V_TOTAL
experiment: CODIET_RECOMMENDER
