solver:
  name: hc_predictor_ce
  model_name: HC-CE
  custom_objective: lagrange
  N_SELECT_FEATURES: 5
  n_runs: 5
  recalculate_dag: true
  feature_selector: SequentialFeatureSelector
  n_outer: 10
  n_inner: 100
  hidden_dim: 32
  depth: 2
  loss_type: l2
  reg_type: l2
  a_reg_type: l1
  lambda1: 0.01
  lambda2: 0.01
  lr_decay: 0.95
  nonzero_threshold: 0.01
  constraints_mode: weights
  callback_mode: all_cycles
  robust: false
  tabu_edges: false
  weights_bound: 1.0
  time_limit: 1800
  target_mip_gap: 0.0001
  data_path: ./data/
  knowledge_graph_filename: knowledge_graph_intersection.graphml
  debug: false
  use_ci_penalty: true
  ci_penalty_kind: conditional_expectation
  ce_constraint_backend: alm_pbm
  ci_mode: manual
  ci_manual_from_training_dag: true
  ci_threshold: 0.0001
  ci_skip_if_direct_edge: true
  ci_add_dsep_independence: true
  ci_add_shielded_collider_dependence: true
  ci_max_dsep_separator_size: null
  ci_dependent_margin: 0.05
  ce_independence_tolerance: 0.0
  ce_use_balanced_batches: true
  ce_batch_size: 128
  ce_sensitive_group_source: auto
  ce_sensitive_bins: 4
  ce_discrete_max_groups: 20
  ci_pbm_mu: 0.3
  ci_pbm_lr: 0.95
  ci_pbm_penalty_update: const
  ci_pbm_init_duals: 0.01
  ci_pbm_init_penalties: 1.0
  ci_pbm_penalty_range:
  - 0.001
  - 100.0
  ci_pbm_dual_range:
  - 0.01
  - 100.0
  constrained: true
  use_w_constraints: true
  rho0: 1.0
  lambda0: 1.0
  alm_momentum: 0.6
  rho_mult: 1.0
  learning_rate: 0.25
  lambda_update_rate: 1.0
  weight_decay: 0.25
problem:
  name: industry_eu
  data_path: data/industry_eu/processed/industry_eu_fred_ExcludingConstruction_16country_monthly_300x16.csv
  frequency: M
  impute: none
  dropna_selected: true
  target: AUT
  features:
  - DEU
  - BEL
  - ITA
  - LUX
  - PRT
  - FRA
  - NLD
  - FIN
  - GRC
  - ESP
  - IRL
  - SVK
  - SVN
  - EST
  - LTU
experiment: INDUSTRY_RECOMMENDER
