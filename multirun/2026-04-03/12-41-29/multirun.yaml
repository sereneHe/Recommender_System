hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra_plugins.hydra_joblib_launcher.joblib_launcher.JoblibLauncher
    n_jobs: 1
    backend: null
    prefer: processes
    require: null
    verbose: 0
    timeout: null
    pre_dispatch: 2*n_jobs
    batch_size: auto
    temp_folder: null
    max_nbytes: null
    mmap_mode: r
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: MULTIRUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=MULTIRUN
    task:
    - experiment=recommender_industry
    - solver=hc_predictor
    - problem=FRED_16country_monthly/industry_eu_aut,FRED_16country_monthly/industry_eu_bel,FRED_16country_monthly/industry_eu_deu,FRED_16country_monthly/industry_eu_esp,FRED_16country_monthly/industry_eu_est,FRED_16country_monthly/industry_eu_fin,FRED_16country_monthly/industry_eu_fra,FRED_16country_monthly/industry_eu_grc,FRED_16country_monthly/industry_eu_irl,FRED_16country_monthly/industry_eu_ita,FRED_16country_monthly/industry_eu_ltu,FRED_16country_monthly/industry_eu_lux,FRED_16country_monthly/industry_eu_nld,FRED_16country_monthly/industry_eu_prt,FRED_16country_monthly/industry_eu_svk,FRED_16country_monthly/industry_eu_svn
  job:
    name: run_experiments
    chdir: null
    override_dirname: experiment=recommender_industry,problem=FRED_16country_monthly/industry_eu_aut,FRED_16country_monthly/industry_eu_bel,FRED_16country_monthly/industry_eu_deu,FRED_16country_monthly/industry_eu_esp,FRED_16country_monthly/industry_eu_est,FRED_16country_monthly/industry_eu_fin,FRED_16country_monthly/industry_eu_fra,FRED_16country_monthly/industry_eu_grc,FRED_16country_monthly/industry_eu_irl,FRED_16country_monthly/industry_eu_ita,FRED_16country_monthly/industry_eu_ltu,FRED_16country_monthly/industry_eu_lux,FRED_16country_monthly/industry_eu_nld,FRED_16country_monthly/industry_eu_prt,FRED_16country_monthly/industry_eu_svk,FRED_16country_monthly/industry_eu_svn,solver=hc_predictor
    id: ???
    num: ???
    config_name: config_industry
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.2
    version_base: '1.3'
    cwd: /Users/xiaoyuhe/Recommender_Pavel
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /Users/xiaoyuhe/Recommender_Pavel/experiments_conf
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: ???
    choices:
      problem: OECD_9country_monthly/industry_eu_aut
      solver: hc_predictor
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: joblib
      hydra/output: default
  verbose: false
solver:
  name: hc_predictor
  model_name: HC
  custom_objective: lagrange
  N_SELECT_FEATURES: 5
  n_runs: 5
  recalculate_dag: true
  feature_selector: SequentialFeatureSelector
  n_outer: 10
  n_inner: 100
  hidden_dim: 32
  depth: 2
  constrained: true
  rho0: 0
  lambda0: 1.0
  rho_mult: 1.0
  learning_rate: 0.25
  lambda_update_rate: 1.0
  weight_decay: 0.25
  loss_type: l2
  reg_type: l2
  a_reg_type: l1
  lambda1: 0.1
  lambda2: 0.1
  nonzero_threshold: 0.001
  constraints_mode: weights
  callback_mode: all_cycles
  robust: false
  tabu_edges: false
  weights_bound: 1.0
  time_limit: 1800
  target_mip_gap: 0.0001
  data_path: ./data/
  knowledge_graph_filename: knowledge_graph_intersection.graphml
  debug: false
problem:
  name: industry_eu
  data_path: data/industry_eu/processed/industry_eu_oecd_ExcludingConstruction_9country_monthly_817x9.csv
  frequency: M
  impute: none
  dropna_selected: true
  target: AUT
  features:
  - DEU
  - BEL
  - PRT
  - ITA
  - LUX
  - FRA
  - NLD
  - FIN
experiment: recommender_industry
