name: mark
model_name: XGB
custom_objective: lagrange #mse_builtin #mse_custom
N_SELECT_FEATURES: 5
n_runs: 5
recalculate_dag: true

#EXDBN parameters
loss_type: l2
reg_type: l2
a_reg_type: l1
lambda1: 000.1
lambda2: 000.1
nonzero_threshold: 0.001
constraints_mode: weights
callback_mode: all_cycles # shortest_cycle
robust: false
tabu_edges: false
weights_bound: 1.0
time_limit: 1800
target_mip_gap: 0.0001


data_path: '../codiet_data/'
knowledge_graph_filename: 'knowledge_graph_intersection.graphml'