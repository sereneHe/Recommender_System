# Inherit shared HC training/constraint defaults from the base solver.  This
# keeps experiment scripts focused on data, seed and the backend under test.
defaults:
  - hc_predictor
  - _self_

name: hc_predictor_ce
model_name: HC-CE
custom_objective: lagrange
N_SELECT_FEATURES: 16
cv_target_bins: 3
#feature_selector: SequentialFeatureSelector

use_validation: true
validation_fraction: 0.2
validation_min_delta: 0.0
early_stopping_patience: 0
restore_best_validation_model: true

# HC-CE uses the generated independence/dependence constraints directly.
# Keep W_est for constructing those constraints, but do not also impose the
# original (W_est - I) mean([X, y_hat]) = 0 constraints.
use_w_constraints: false

# MILP parameters
loss_type: l2
reg_type: l2
a_reg_type: l1
lambda1: 0.01
lambda2: 0.01
lr_decay: 0.95
nonzero_threshold: 0.01
constraints_mode: weights
callback_mode: all_cycles
robust: false
tabu_edges: false
weights_bound: 1.0
time_limit: 1800
target_mip_gap: 0.0001

# codiet parameters
data_path: './data/'
knowledge_graph_filename: 'knowledge_graph_intersection.graphml'
debug: false

ce_independence_tolerance: 0.0
# Continuous CE uses a dimensionless partial correlation by default.  The
# scalar shrinkage is an explicit experimental regularizer, not a
# Ledoit-Wolf covariance estimator; compare shrinkage=0 in ablations.
ce_statistic_kind: partial_correlation
ce_statistic_shrinkage: 0.1
ce_statistic_eps: 1.0e-8
ce_tolerance_mode: standard_error
ce_tolerance_sd_multiplier: 1.96
# auto uses empirical contiguous-window spread when >= 5 windows of 100 rows
# are available; otherwise it falls back to Newey-West HAC. This is an
# uncertainty scale, not a classical iid confidence interval.
ce_se_method: auto
ce_window_n_windows: 5
ce_window_min_size: 100
# Aliases used by the CE-new launch scripts (experiments_ce_new_recommender_*).
# Kept null so the canonical keys above win unless a script explicitly sets an
# alias; hc_predictor_ce.py accepts either name.
ce_cross_window_n_windows: null
ce_cross_window_min_size: null
ce_hac_max_lag: 6
# Sign-flip filtering applies only to signed dependence constraints. For
# d-separation independences, sign changes around the null value zero are not
# a validity diagnostic and those constraints are never removed for that.
ce_window_filter_enabled: true
ce_window_max_sign_flip_rate: 0.30
ce_window_sign_epsilon: 0.01
ce_residualize_method: linear
ce_residualize_iterations: 12
ce_residualize_eps: 0.001
# auto: discrete targets use target-value groups; continuous targets use target quantile pseudo groups.
ce_sensitive_group_source: auto
ce_sensitive_bins: 4
ce_discrete_max_groups: 20
ce_pbm_backend: stochastic_pbm
ci_pbm_pbf: quadratic_logarithmic
ci_pbm_dual_ema_gamma: 0.9
# Aliases matching the SPBM examples under spbm/.
ci_pbm_gamma: 0.9
ci_pbm_penalty_mult: 0.95
ci_pbm_mu: 0.3
ci_pbm_lr: 0.95
ci_pbm_penalty_update: adapt
ci_pbm_epoch_len: 100
ci_pbm_adapt_delta: 1.5
ci_pbm_init_duals: 0.01
ci_pbm_init_penalties: 1.0
ci_pbm_penalty_range:
  - 0.001
  - 100.0
ci_pbm_dual_range:
  - 0.01
  - 100.0

# Unified stochastic constrained optimizer controls.
# Prox is injected into parameter gradients like PBM.py / ssl_alm_adam.py modified Adam.
use_stochastic_constrained_optimizer: true
sco_prox_mu: 0.3
sco_prox_center_decay: 0.5
sco_dual_ema_gamma: 0.0
sco_use_adaptive_penalty: false
sco_penalty_violation_tol: 0.0
sco_alm_penalty_mult: 1.05
sco_pbm_penalty_mult: 0.95
sco_alm_penalty_range:
  - 0.000001
  - 1000000.0
sco_pbm_penalty_range:
  - 0.000001
  - 1000000.0
